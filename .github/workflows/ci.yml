name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'

jobs:
  quality:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Format check
        run: pnpm format:check

      # Includes the Clean Architecture dependency rule (SDD 24.4): a domain
      # file importing Express fails the build here, not in review.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: leenmart
          POSTGRES_PASSWORD: leenmart
          POSTGRES_DB: leenmart_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leenmart"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      # Provisioning, in the order the roles require: the schema and the roles
      # come from migrations, then the roles get the passwords the runtime URLs
      # below use. Until now CI ran the integration suite against a database
      # with no tables at all.
      - name: Provision the test database
        working-directory: apps/api
        env:
          ENV_FILE: .env.test
          DATABASE_URL: postgresql://leenmart:leenmart@localhost:5432/leenmart_test?schema=public
          APP_DATABASE_URL: postgresql://leenmart_app:leenmart_app_dev@localhost:5432/leenmart_test?schema=public
          ADMIN_DATABASE_URL: postgresql://leenmart_admin:leenmart_admin_dev@localhost:5432/leenmart_test?schema=public
        run: |
          pnpm db:migrate:deploy
          pnpm db:provision-roles

      - name: Run integration tests
        working-directory: apps/api
        env:
          ENV_FILE: .env.test
          DATABASE_URL: postgresql://leenmart:leenmart@localhost:5432/leenmart_test?schema=public
          APP_DATABASE_URL: postgresql://leenmart_app:leenmart_app_dev@localhost:5432/leenmart_test?schema=public
          ADMIN_DATABASE_URL: postgresql://leenmart_admin:leenmart_admin_dev@localhost:5432/leenmart_test?schema=public
          REDIS_URL: redis://localhost:6379/1
        run: pnpm test:integration

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Blocking, not advisory (SDD 23.1, A06).
      - name: Audit dependencies
        run: pnpm audit --audit-level high
